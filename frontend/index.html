<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Book a self-drive car in minutes. Live availability, transparent pricing, and pickup at a location near you."
    />
    <meta name="theme-color" content="#0A1524" />

    <!--
      Set the theme BEFORE first paint to avoid a light/dark flash (FOUC).
      Rule: a saved manual choice wins; otherwise follow the OS setting.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme'); // 'light' | 'dark' | null
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = stored ? stored === 'dark' : prefersDark;
          var root = document.documentElement;
          root.classList.toggle('dark', useDark);
          root.style.colorScheme = useDark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage blocked — fall back to the CSS default (light). */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Akash Car Rental — Self-drive cars, booked in minutes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
