    <!--
      Structured data (JSON-LD): tells Google this is a local car-rental business,
      where it is, and the areas it serves. This is in the initial HTML, so search
      engines read it without executing any JavaScript.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoRental",
      "@id": "https://www.akashcarrental.com/#business",
      "name": "Akash Car Rental",
      "description": "Self-drive car rental serving Kharar, Mohali, Chandigarh and Hamirpur (HP).",
      "url": "https://www.akashcarrental.com/",
      "image": "https://www.akashcarrental.com/og-image.jpg",
      "telephone": "+91-7876573193",
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Near Bhagomajra Toll Plaza",
        "addressLocality": "Kharar",
        "addressRegion": "Punjab",
        "postalCode": "140301",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 30.7460,
        "longitude": 76.6469
      },
      "areaServed": [
        { "@type": "City", "name": "Kharar" },
        { "@type": "City", "name": "Mohali" },
        { "@type": "City", "name": "Chandigarh" },
        { "@type": "City", "name": "Hamirpur" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "08:00",
        "closes": "21:00"
      }
    }
    </script>

    <!--
      Set the theme BEFORE first paint to avoid a light/dark flash (FOUC).
      Rule: a saved manual choice wins; otherwise follow the OS setting.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme'); // 'light' | 'dark' | null
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var useDark = stored ? stored === 'dark' : prefersDark;
          var root = document.documentElement;
          root.classList.toggle('dark', useDark);
          root.style.colorScheme = useDark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage blocked — fall back to the CSS default (light). */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"

    />
    <link rel="icon" type="image/png" href="/favicon.png" />

  <body>
    <div id="root"></div>

  </body>
